<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Data-Driven Decision-Making Through AniTech</title>
  <desc id="desc">Diagram showing performance indicators reviewed by administrators, converted into operational decisions, actions, reports, and a continuous improvement cycle.</desc>
  <defs><marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13 z" fill="#bf7717"/></marker></defs>
  <style>
    .bg{fill:#f5f8f6}.head{fill:#064f40}.input{fill:#eaf1fb;stroke:#537db3;stroke-width:2}.review{fill:#fff4df;stroke:#d18a29;stroke-width:3}.action{fill:#fff;stroke:#ecd3a5;stroke-width:2}.output{fill:#e8f6ee;stroke:#4f9b70;stroke-width:3}.arrow{fill:none;stroke:#bf7717;stroke-width:4;marker-end:url(#arrow)}.title{font:700 32px Arial,sans-serif}.sub{font:500 17px Arial,sans-serif}.h{font:700 23px Arial,sans-serif}.t{font:500 17px Arial,sans-serif}.small{font:500 15px Arial,sans-serif}.ink{fill:#153c32}.muted{fill:#5f7069}.white{fill:#fff}.orange{fill:#bf7717}.green{fill:#0f7a59}
  </style>
  <rect class="bg" width="1600" height="900"/><rect class="head" width="1600" height="112"/>
  <text class="white title" x="64" y="52">Figure X. Data-Driven Decision-Making Through AniTech</text><text class="white sub" x="64" y="82">Administrators use monitored performance indicators to plan actions, address issues, and document results.</text>
  <rect class="input" x="65" y="320" width="300" height="210" rx="20"/><text class="ink h" x="113" y="370">Performance</text><text class="ink h" x="132" y="400">Indicators</text><line x1="95" y1="422" x2="335" y2="422" stroke="#a8c0df"/><text class="muted small" x="95" y="451">Compliance, collections,</text><text class="muted small" x="95" y="475">queue aging, turnaround time,</text><text class="muted small" x="95" y="499">claims, and inquiry patterns</text>
  <rect class="review" x="485" y="285" width="320" height="280" rx="20"/><text class="ink h" x="548" y="337">Administrator Review</text><text class="muted t" x="521" y="375">Dashboard results are reviewed</text><text class="muted t" x="521" y="402">by period, barangay, status,</text><text class="muted t" x="521" y="429">and transaction type.</text><rect fill="#bf7717" x="539" y="463" width="212" height="50" rx="10"/><text class="white t" x="575" y="495">Identify Priority Issues</text>
  <rect class="action" x="935" y="170" width="290" height="125" rx="16"/><text class="ink h" x="972" y="212">Prioritize Requests</text><text class="muted small" x="962" y="244">Address overdue applications</text><text class="muted small" x="962" y="267">and renewals in the queue</text>
  <rect class="action" x="935" y="325" width="290" height="125" rx="16"/><text class="ink h" x="960" y="367">Target Follow-Ups</text><text class="muted small" x="962" y="399">Contact areas with low renewal</text><text class="muted small" x="962" y="422">compliance or inactive members</text>
  <rect class="action" x="935" y="480" width="290" height="125" rx="16"/><text class="ink h" x="965" y="522">Improve Services</text><text class="muted small" x="962" y="554">Resolve common document issues</text><text class="muted small" x="962" y="577">and recurring farmer inquiries</text>
  <rect class="action" x="935" y="635" width="290" height="125" rx="16"/><text class="ink h" x="970" y="677">Plan Resources</text><text class="muted small" x="962" y="709">Use claim and payment trends for</text><text class="muted small" x="962" y="732">service and financial planning</text>
  <rect class="output" x="1330" y="285" width="220" height="280" rx="20"/><text class="ink h" x="1360" y="335">Actions and</text><text class="ink h" x="1355" y="365">Management</text><text class="ink h" x="1380" y="395">Reports</text><line x1="1360" y1="417" x2="1520" y2="417" stroke="#9fcbb2"/><text class="muted small" x="1360" y="449">• Operational actions</text><text class="muted small" x="1360" y="477">• Service improvements</text><text class="muted small" x="1360" y="505">• CSV, Excel, PDF reports</text><text class="muted small" x="1360" y="533">• Evidence for planning</text>
  <path class="arrow" d="M365 425 H470"/><path class="arrow" d="M805 425 H880 Q900 425 900 232 H925"/><path class="arrow" d="M805 425 H925"/><path class="arrow" d="M805 425 H880 Q900 425 900 542 H925"/><path class="arrow" d="M805 425 H870 Q900 425 900 697 H925"/>
  <path class="arrow" d="M1225 232 H1270 Q1300 232 1300 350 H1320"/><path class="arrow" d="M1225 387 H1320"/><path class="arrow" d="M1225 542 H1270 Q1300 542 1300 500 H1320"/><path class="arrow" d="M1225 697 H1270 Q1300 697 1300 510 H1320"/>
  <path d="M1440 565 V815 H215 V550" fill="none" stroke="#6b9a85" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text class="muted small" x="602" y="808">Implemented actions generate new records, enabling continuous monitoring and improvement.</text>
  <text class="green h" x="65" y="858">Result:</text><text class="ink t" x="155" y="858">AniTech supports evidence-based actions instead of decisions based only on manual review or assumptions.</text>
</svg>
