<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Performance Monitoring Through AniTech Operations Analytics</title>
  <desc id="desc">Diagram showing analytics-ready records transformed into membership, transaction, efficiency, and service performance indicators for dashboard monitoring.</desc>
  <defs><marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0 0 L13 6.5 L0 13 z" fill="#527db2"/></marker></defs>
  <style>
    .bg{fill:#f5f8f6}.head{fill:#064f40}.input{fill:#e8f6ee;stroke:#55a276;stroke-width:2}.engine{fill:#eaf1fb;stroke:#537db3;stroke-width:3}.metric{fill:#fff;stroke:#b9cde5;stroke-width:2}.monitor{fill:#edf3ff;stroke:#537db3;stroke-width:3}.arrow{fill:none;stroke:#527db2;stroke-width:4;marker-end:url(#arrow)}.title{font:700 32px Arial,sans-serif}.sub{font:500 17px Arial,sans-serif}.h{font:700 23px Arial,sans-serif}.t{font:500 17px Arial,sans-serif}.small{font:500 15px Arial,sans-serif}.ink{fill:#153c32}.muted{fill:#5f7069}.white{fill:#fff}.blue{fill:#4d78ad}
  </style>
  <rect class="bg" width="1600" height="900"/><rect class="head" width="1600" height="112"/>
  <text class="white title" x="64" y="52">Figure X. Performance Monitoring Through AniTech Operations Analytics</text><text class="white sub" x="64" y="82">Analytics-ready records are converted into measurable operational indicators.</text>
  <rect class="input" x="65" y="330" width="260" height="185" rx="18"/><text class="ink h" x="96" y="377">Analytics-Ready</text><text class="ink h" x="120" y="406">Information</text><line x1="94" y1="427" x2="296" y2="427" stroke="#9fcbb2"/><text class="muted small" x="94" y="455">Validated, filtered, and</text><text class="muted small" x="94" y="480">aggregated organizational</text><text class="muted small" x="94" y="505">records and transactions</text>
  <rect class="engine" x="440" y="310" width="290" height="225" rx="20"/><text class="ink h" x="491" y="360">Operations Analytics</text><text class="muted t" x="480" y="394">Dashboard processing</text><text class="muted t" x="480" y="423">and comparison of data</text><rect fill="#537db3" x="480" y="452" width="210" height="43" rx="9"/><text class="white t" x="520" y="480">Performance Indicators</text>
  <rect class="metric" x="850" y="178" width="320" height="128" rx="16"/><text class="ink h" x="880" y="220">Membership Performance</text><text class="muted small" x="880" y="252">• Active and inactive farmers</text><text class="muted small" x="880" y="278">• Renewal compliance by year/barangay</text>
  <rect class="metric" x="850" y="338" width="320" height="128" rx="16"/><text class="ink h" x="880" y="380">Transaction Performance</text><text class="muted small" x="880" y="412">• Application and renewal status</text><text class="muted small" x="880" y="438">• Verified payments and collections</text>
  <rect class="metric" x="850" y="498" width="320" height="128" rx="16"/><text class="ink h" x="880" y="540">Processing Efficiency</text><text class="muted small" x="880" y="572">• Queue aging</text><text class="muted small" x="880" y="598">• Average turnaround time</text>
  <rect class="metric" x="850" y="658" width="320" height="128" rx="16"/><text class="ink h" x="880" y="700">Service Monitoring</text><text class="muted small" x="880" y="732">• Mortuary assistance claims</text><text class="muted small" x="880" y="758">• Inquiries, document issues, rejections</text>
  <rect class="monitor" x="1285" y="334" width="260" height="205" rx="20"/><text class="ink h" x="1330" y="381">Administrator</text><text class="ink h" x="1350" y="411">Monitoring</text><line x1="1314" y1="432" x2="1517" y2="432" stroke="#9fb8d7"/><text class="muted small" x="1314" y="460">Review trends and compare</text><text class="muted small" x="1314" y="484">metrics by period, status,</text><text class="muted small" x="1314" y="508">and barangay.</text>
  <path class="arrow" d="M325 422 H425"/><path class="arrow" d="M730 422 H800 Q820 422 820 242 H840"/><path class="arrow" d="M730 422 H840"/><path class="arrow" d="M730 422 H800 Q820 422 820 562 H840"/><path class="arrow" d="M730 422 H790 Q820 422 820 722 H840"/>
  <path class="arrow" d="M1170 242 H1235 Q1260 242 1260 385 H1275"/><path class="arrow" d="M1170 402 H1275"/><path class="arrow" d="M1170 562 H1235 Q1260 562 1260 490 H1275"/><path class="arrow" d="M1170 722 H1235 Q1260 722 1260 500 H1275"/>
  <text class="blue h" x="65" y="850">Result:</text><text class="ink t" x="155" y="850">The dashboard makes operational performance visible, measurable, and easier to review over time.</text>
</svg>
