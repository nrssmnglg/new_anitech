services:
  - type: web
    name: anitech-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: APP_MAINTENANCE_DRIVER
        value: cache
      - key: APP_MAINTENANCE_STORE
        value: database
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "false"

  - type: worker
    name: anitech-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    autoDeploy: true
    envVars:
      - key: APP_ENV
        fromService:
          type: web
          name: anitech-web
          envVarKey: APP_ENV
      - key: APP_DEBUG
        fromService:
          type: web
          name: anitech-web
          envVarKey: APP_DEBUG
      - key: APP_KEY
        fromService:
          type: web
          name: anitech-web
          envVarKey: APP_KEY
      - key: APP_URL
        fromService:
          type: web
          name: anitech-web
          envVarKey: APP_URL
      - key: DB_CONNECTION
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_CONNECTION
      - key: DB_HOST
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_HOST
      - key: DB_PORT
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_PORT
      - key: DB_DATABASE
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_DATABASE
      - key: DB_USERNAME
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_USERNAME
      - key: DB_PASSWORD
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_PASSWORD
      - key: SESSION_DRIVER
        fromService:
          type: web
          name: anitech-web
          envVarKey: SESSION_DRIVER
      - key: CACHE_STORE
        fromService:
          type: web
          name: anitech-web
          envVarKey: CACHE_STORE
      - key: QUEUE_CONNECTION
        fromService:
          type: web
          name: anitech-web
          envVarKey: QUEUE_CONNECTION

  - type: cron
    name: anitech-cron
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "* * * * *"
    dockerCommand: php artisan schedule:run
    autoDeploy: true
    envVars:
      - key: APP_ENV
        fromService:
          type: web
          name: anitech-web
          envVarKey: APP_ENV
      - key: APP_DEBUG
        fromService:
          type: web
          name: anitech-web
          envVarKey: APP_DEBUG
      - key: APP_KEY
        fromService:
          type: web
          name: anitech-web
          envVarKey: APP_KEY
      - key: APP_URL
        fromService:
          type: web
          name: anitech-web
          envVarKey: APP_URL
      - key: DB_CONNECTION
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_CONNECTION
      - key: DB_HOST
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_HOST
      - key: DB_PORT
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_PORT
      - key: DB_DATABASE
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_DATABASE
      - key: DB_USERNAME
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_USERNAME
      - key: DB_PASSWORD
        fromService:
          type: web
          name: anitech-web
          envVarKey: DB_PASSWORD
      - key: SESSION_DRIVER
        fromService:
          type: web
          name: anitech-web
          envVarKey: SESSION_DRIVER
      - key: CACHE_STORE
        fromService:
          type: web
          name: anitech-web
          envVarKey: CACHE_STORE
      - key: QUEUE_CONNECTION
        fromService:
          type: web
          name: anitech-web
          envVarKey: QUEUE_CONNECTION
